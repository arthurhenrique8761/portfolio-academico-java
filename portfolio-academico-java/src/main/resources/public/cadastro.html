<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Projetos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="tela-login-body">
    <main class="login-card">
        <div class="login-cabecalho">
            <h1>Criar Conta</h1>
            <p>Cadastre um novo usuário para acessar o sistema</p>
        </div>

        <form id="formCadastro" class="login-form">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Ex.: João Silva" required>

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Ex.: joao.silva"
                required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password"
                placeholder="Mínimo de 4 caracteres" required>

            <p id="mensagemCadastro" class="mensagem-login" aria-live="polite"></p>

            <button type="submit" id="btnCadastrar">Cadastrar</button>
        </form>

        <p class="link-secundario-login">
            Já tem conta? <a href="login.html">Fazer login</a>
        </p>
    </main>

    <script src="js/cadastro.js"></script>
</body>

</html>
